<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descubre tu rutina NIVEA – Encuesta de tipo de piel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0033A0; --navy:#001E78; --ice:#EEF2FB; --line:#D6DEF2; --ink:#17203A; --muted:#5A6482;
    --white:#fff; --accent:#C8102E; --ok:#1E7B4D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ice);color:var(--ink);font-family:'Nunito Sans',Arial,sans-serif}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column}
  header{background:var(--blue);color:#fff;padding:18px 22px 20px}
  .brand{font-weight:800;letter-spacing:.12em;font-size:15px}
  .brand small{font-weight:600;letter-spacing:.02em;opacity:.85;margin-left:8px}
  main{flex:1;padding:22px}
  h1{font-size:27px;line-height:1.15;margin:6px 0 10px;color:var(--navy)}
  h2{font-size:21px;line-height:1.25;margin:0 0 16px;color:var(--navy)}
  p{line-height:1.5;margin:0 0 14px}
  .lead{color:var(--muted);font-size:16px}
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:15px 18px;font:700 16px 'Nunito Sans',Arial;cursor:pointer;background:var(--blue);color:#fff}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
  .row{display:flex;gap:10px;margin-top:18px}
  .row .btn{flex:1}
  .steps-intro{list-style:none;padding:0;margin:20px 0 26px}
  .steps-intro li{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-size:15px}
  .dot{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ice);color:var(--blue);font-weight:800;display:grid;place-items:center}
  .progress{height:6px;background:var(--ice);border-radius:9px;overflow:hidden;margin-bottom:8px}
  .progress span{display:block;height:100%;background:var(--blue);transition:width .25s}
  .qcount{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:600}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font:600 15px 'Nunito Sans',Arial;color:var(--ink);cursor:pointer;line-height:1.35}
  .opt small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
  .opt.sel{border-color:var(--blue);background:var(--ice)}
  .result-top{background:var(--ice);border-radius:18px;padding:18px;margin-bottom:18px}
  .tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin:0 6px 6px 0}
  .tag.alt{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
  .switch{display:flex;background:var(--ice);border-radius:999px;padding:4px;margin:6px 0 18px}
  .switch button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px;font:700 14px 'Nunito Sans',Arial;color:var(--blue);cursor:pointer}
  .switch button.on{background:var(--blue);color:#fff}
  .moment{margin-bottom:22px}
  .moment h3{font-size:16px;margin:0 0 10px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .card{display:flex;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .thumb{flex:none;width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff}
  .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;margin-top:2px}
  .step{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .prod{font-weight:800;font-size:15px;margin:2px 0 3px;color:var(--ink)}
  .why{font-size:14px;color:var(--muted);line-height:1.4}
  .note{font-size:13px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
  .list{background:var(--ice);border-radius:14px;padding:14px 16px;margin:4px 0 18px}
  .list li{margin:6px 0;font-size:14px}
  footer{padding:14px 22px 22px;font-size:12px;color:var(--muted)}
  .hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand">NIVEA <small>× Preunic</small></div></header>
  <main id="view"></main>
  <footer>Recomendación cosmética referencial, no reemplaza la evaluación de un profesional de la salud. Si tienes una condición dermatológica o una reacción a un producto, consulta a un dermatólogo. Encuesta anónima: no recopilamos datos personales.</footer>
</div>

/* ---------- Registro de respuestas en Google Sheets ----------
   Pega aquí la URL /exec de la aplicación web de Apps Script (ver Codigo.gs).
   Si queda vacía, la encuesta funciona igual pero no registra respuestas. */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwCej1DNg08TT5guPdDUYBeokA-3W-J3uD0_9f_NCuerkA-wf8cNhlc-hJOweQ_TSAM/exec';

function registrar(d, r){
  if (!ENDPOINT) return;
  const txt = k => { const q = Q.find(x=>x.k===k); const a = S.a[k];
    return Array.isArray(a) ? a.map(j=>q.o[j][0]).join(' / ') : (a===undefined ? '' : q.o[a][0]); };
  const productos = [...r.am, ...r.pm, ...r.wk].map(x=>x.p.n).filter((p,i,a)=>a.indexOf(p)===i).join(' | ');
  const datos = {
    pregunta1: txt('q1'), pregunta2: txt('q2'), pregunta3: txt('q3'),
    pregunta4: txt('q4'), pregunta5: txt('q5'), pregunta6: txt('q6'),
    tipoPiel: TYPE_NAME[d.type], sensible: d.sens ? 'Sí' : 'No', productos
  };
  try {
    fetch(ENDPOINT, { method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(datos) }).catch(()=>{});
  } catch(e) {}
}

const S = {i:-1, a:{}, mode:null};
const view = document.getElementById('view');

function intro(){
  view.innerHTML = `
    <h1>Descubre la rutina ideal para tu piel</h1>
    <p class="lead">Responde 6 preguntas rápidas y te recomendamos una rutina facial completa con productos NIVEA que encuentras en esta tienda.</p>
    <ul class="steps-intro">
      <li><span class="dot">1</span>Conoce tu tipo de piel</li>
      <li><span class="dot">2</span>Principal beneficio deseado</li>
      <li><span class="dot">3</span>Recomendación de rutina de día y noche</li>
    </ul>
    <button class="btn" id="go">Comenzar</button>
    <p class="note">Toma menos de 1 minuto.<br><br><strong>Sobre tus respuestas:</strong> la encuesta es anónima y voluntaria. No te pedimos nombre, RUT, correo, teléfono ni otros datos que te identifiquen. Guardamos solo tus respuestas y la rutina recomendada, sin asociarlas a ninguna persona, para fines estadísticos y para mejorar estas recomendaciones. No se usan para contactarte ni se venden a terceros.</p>`;
  document.getElementById('go').onclick = ()=>{S.i=0; question();};
}

function question(){
  const q = Q[S.i], sel = S.a[q.k];
  const isSel = j => q.multi ? (sel||[]).includes(j) : sel===j;
  const ready = q.multi ? (sel||[]).length>0 : sel!==undefined;
  view.innerHTML = `
    <div class="progress"><span style="width:${(S.i)/Q.length*100}%"></span></div>
    <div class="qcount">Pregunta ${S.i+1} de ${Q.length}</div>
    <h2>${q.t}</h2>${q.h?`<p class="lead" style="margin-top:-8px">${q.h}</p>`:''}
    <div class="opts">${q.o.map((o,j)=>`<button class="opt${isSel(j)?' sel':''}" data-j="${j}">${o[0]}${o[1]?`<small>${o[1]}</small>`:''}</button>`).join('')}</div>
    <div class="row">
      <button class="btn ghost" id="back">Atrás</button>
      <button class="btn" id="next" ${ready?'':'disabled'}>${S.i===Q.length-1?'Ver mi rutina':'Siguiente'}</button>
    </div>`;
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j;
    if (q.multi){
      let cur=(S.a[q.k]||[]).slice();
      if (cur.includes(j)) cur=cur.filter(x=>x!==j);
      else { if (cur.length>=q.multi) cur.shift(); cur.push(j); }
      S.a[q.k]=cur;
      view.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', cur.includes(+x.dataset.j)));
      document.getElementById('next').disabled = cur.length===0;
    } else {
      S.a[q.k]=j;
      view.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
      document.getElementById('next').disabled=false;
      setTimeout(next, 180);
    }
  });
  document.getElementById('back').onclick=()=>{ if(S.i===0){S.i=-1;intro();} else {S.i--;question();} };
  document.getElementById('next').onclick=next;
  window.scrollTo(0,0);
}
function next(){ const v=S.a[Q[S.i].k]; if(v===undefined || (Array.isArray(v)&&!v.length)) return; if(S.i<Q.length-1){S.i++;question();} else result(); }

/* ---------- Lógica de diagnóstico ---------- */
function diagnose(){
  const v = k => Q.find(q=>q.k===k).o[S.a[k]][2];
  const oil = (v('q1')+v('q2')+v('q3'))/3;
  const type = oil < 0.75 ? 'seca' : oil < 1.5 ? 'normal' : oil < 2.4 ? 'mixta' : 'grasa';
  const sens = v('q5')===2 || (v('q5')===1 && type==='seca');
  const breakouts = v('q4');
  const q6 = Q.find(q=>q.k==='q6');
  const concerns = (S.a.q6||[]).map(j=>q6.o[j][2]);
  return {type, sens, breakouts, concerns};
}

function routine(d){
  const {type, sens, concerns} = d;
  const has = c => concerns.includes(c);
  const oily = type==='mixta' || type==='grasa';
  // limpieza (prioridad: sensible > imperfecciones > luminosidad > manchas > arrugas > base)
  let clean = type==='seca' ? P.micSeca : type==='grasa' ? P.gelDerma : P.gelRoses;
  if (sens) clean = P.micSens;
  else if (has('imp') && oily) clean = P.gelDerma;
  else if (has('glo')) clean = P.gelGlow;
  else if (has('man') && !oily) clean = P.micIlum;
  else if (has('arr') && !oily) clean = P.micRegen;
  // hidratantes (prioridad: arrugas > primeras líneas > base)
  let day = {seca:P.diaSeca, normal:P.diaNormal, mixta:P.diaRoses, grasa:P.diaDerma}[type];
  if (has('hid') && type!=='seca') day = P.diaRoses;
  let night = type==='seca' ? P.nocheSeca : P.diaRoses; // gel crema Rose Care: sin FPS, apta día y noche
  if (has('arr')) { day = P.diaEpi; night = P.nocheEpi; }
  else if (has('lin')) { day = P.diaQ10; night = P.nocheQ10; }
  else if (has('man')) { night = P.nocheLum; }
  // contorno
  const eyes = has('arr') ? P.ojosEpi : has('lin') ? P.ojosQ10 : has('man') ? P.ojosLum : null;
  // protector (prioridad: manchas > imperfecciones piel grasa/mixta > luminosidad > primeras líneas > base)
  let spf = type==='grasa' ? P.spfDerma : P.spfInv;
  if (has('man')) spf = P.spfLum;
  else if (has('imp') && oily) spf = P.spfDerma;
  else if (has('glo')) spf = P.spfGlow;
  else if (has('lin')) spf = P.spfQ10;
  // sérums: máximo uno de día y uno de noche
  const cand = [];
  if (has('arr')) cand.push({p:P.serEpi, pref:'pm', age:true, w:'Rejuvenece la piel desde las células y mejora la firmeza.'});
  else if (has('lin')) cand.push({p:P.serQ10, pref:'pm', age:true, w:'Rellena y suaviza las primeras líneas.'});
  if (has('man')) cand.push({p:P.serLum, pref:'am', w:'Trata las manchas y empareja el tono. Aplica 2 o 3 gotas.'});
  if (has('imp')) cand.push({p:P.serDerma, pref:'pm', w:'Reduce granitos y marcas. Aplica en todo el rostro o en las zonas con imperfecciones.'});
  if (has('glo') && !has('man')) cand.push({p:P.serGlow, pref:'am', w:'Unifica el tono y da luminosidad. Aplica 2 o 3 gotas.'});
  let serAM=null, serPM=null;
  for (const c of cand){
    if (c.pref==='am' && !serAM) serAM=c;
    else if (c.pref==='pm' && !serPM) serPM=c;
    else if (!serAM && !c.age) serAM=c;
    else if (!serPM) serPM=c;
  }
  // tónico y semanal
  let tonic = null;
  if (!sens && has('glo')) tonic = P.tonGlow;
  else if (!sens && has('hid')) tonic = P.mistRoses;
  const wk = [];
  if (!sens && has('imp') && !has('glo')) wk.push({s:'Exfoliación', p:P.peeling, w:'1 o 2 noches a la semana, en reemplazo del sérum. No lo combines con otros exfoliantes.'});
  if (has('hid') || type==='seca') wk.push({s:'Mascarilla', p:P.mascRoses, w:'1 o 2 veces a la semana, sobre la piel limpia.'});

  const am = [], pm = [];
  am.push({s:'Limpieza', p:clean, w: sens ? 'Limpia sin frotar: empapa un algodón y pásalo con suavidad.' : 'Retira el sebo y las impurezas de la noche.'});
  if (tonic) am.push({s:'Tónico', p:tonic, w: tonic===P.tonGlow ? 'Afina la textura y aporta luminosidad. Al principio úsalo día por medio.' : 'Refresca e hidrata. Vaporiza sobre el rostro limpio.'});
  if (serAM) am.push({s:'Sérum', p:serAM.p, w:serAM.w});
  am.push({s:'Hidratante de día', p:day, w: day===P.diaEpi ? 'Rejuvenece y protege con FPS 30.' : day===P.diaQ10 ? 'Suaviza las primeras líneas y protege del sol.' : day===P.diaDerma ? 'Hidrata, controla el brillo hasta 8 horas y protege con FPS 50+.' : 'Hidrata y prepara la piel para el día.'});
  if (!(day===P.diaDerma && spf===P.spfDerma)) am.push({s:'Protector solar', p:spf, w:'El paso más importante para prevenir manchas y envejecimiento. Reaplica cada 2 a 3 horas si estás al sol.'});
  const pmClean = has('imp') && oily && !sens ? P.micDerma : clean;
  pm.push({s:'Limpieza', p:pmClean, w: pmClean===P.micDerma ? 'Desmaquilla y destapa los poros; luego enjuaga con el gel limpiador.' : 'Retira el maquillaje, el protector y la contaminación del día.'});
  if (serPM) pm.push({s:'Sérum', p:serPM.p, w:serPM.w});
  if (eyes) pm.push({s:'Contorno de ojos', p:eyes, w:'Aplica con toques suaves del dedo anular, desde el lagrimal hacia afuera.'});
  pm.push({s:'Crema de noche', p:night, w: night===P.diaRoses ? 'Gel crema liviano con ácido hialurónico: hidrata sin engrasar mientras duermes.' : 'Repara y regenera la piel mientras duermes.'});
  return {am, pm, wk};
}

function result(){
  const d = diagnose(); const r = routine(d);
  registrar(d, r);
  const tags = `<span class="tag">Piel ${TYPE_NAME[d.type].toLowerCase()}${d.sens?' y sensible':''}</span>` + d.concerns.map(c=>`<span class="tag alt">${CONCERN[c]}</span>`).join('');
  let n = 0;
  const block = (title, arr) => arr.length ? `<div class="moment"><h3>${title}</h3>${arr.map(x=>`
      <div class="card"><div class="num">${++n}</div>${x.p.img?`<img class="thumb" src="${x.p.img}" alt="" loading="lazy" onerror="this.remove()">`:''}<div>
        <div class="step">${x.s}</div><div class="prod">${x.p.n}</div><div class="why">${x.w}</div></div></div>`).join('')}</div>` : '';
  const all = [...r.am, ...r.pm, ...r.wk].map(x=>x.p).filter((p,i,a)=>a.indexOf(p)===i);
  view.innerHTML = `
    <div class="result-top">
      <div class="qcount" style="margin-bottom:6px">Tu resultado</div>
      <h1 style="margin-top:0">Tu piel es ${TYPE_NAME[d.type].toLowerCase()}${d.sens?' y sensible':''}</h1>
      <p class="lead" style="margin-bottom:10px">${TYPE_DESC[d.type]}${d.sens?' Además reacciona con facilidad, así que elegimos productos suaves y sin exfoliantes.':''}</p>
      ${tags}
    </div>
    ${block('Mañana', r.am)}${(n=0,'')}
    ${block('Noche', r.pm)}${(n=0,'')}
    ${block('1 o 2 veces por semana', r.wk)}
    <h3 style="font-size:16px;color:var(--navy);margin:4px 0 8px">Tu lista para llevar</h3>
    <ul class="list">${all.map(p=>`<li>${p.n}</li>`).join('')}</ul>
    ${d.breakouts===2 && !d.concerns.includes('imp') ? '<p class="note" style="border:0;padding:0">Nos contaste que te salen granitos seguido: si quieres tratarlos, repite la encuesta eligiendo "Granitos e imperfecciones".</p>':''}
    <p class="note">Muestra esta pantalla en la góndola NIVEA o a un vendedor para encontrar tus productos. Empieza con un producto nuevo a la vez y suma el siguiente después de unos días.</p>
    <button class="btn ghost" id="again" style="margin-top:14px">Volver a empezar</button>`;
  document.getElementById('again').onclick=()=>{S.i=-1;S.a={};intro();};
  window.scrollTo(0,0);
}
intro();
</script>
